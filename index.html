<!-- الجزء 1 / 5 -->

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AZZI WORLD 3D</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
font-family:Arial,sans-serif;
}

#globe{
position:fixed;
inset:0;
width:100%;
height:100%;
}

.title{
position:fixed;
top:18px;
right:18px;
z-index:100;

padding:12px 20px;

background:white;
color:#172033;

border-radius:15px;

font-size:20px;
font-weight:bold;

box-shadow:0 4px 20px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<div class="title">
🌍 AZZI WORLD
</div>

<div id="globe"></div>
<!-- الجزء 2 / 5 -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

const container =
document.getElementById("globe");


const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0xffffff);


const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth /
window.innerHeight,
0.1,
1000
);

camera.position.set(
0,
0,
3
);


const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio,
2
)
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

container.appendChild(
renderer.domElement
);


const controls =
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;

controls.enablePan=false;

controls.minDistance=1.5;

controls.maxDistance=5;
<!-- الجزء 3 / 5 -->

const ambient =
new THREE.AmbientLight(
0xffffff,
2
);

scene.add(ambient);


const light =
new THREE.DirectionalLight(
0xffffff,
3
);

light.position.set(
5,
3,
5
);

scene.add(light);


/* الكرة الأرضية */

const earth =
new THREE.Mesh(

new THREE.SphereGeometry(
1,
64,
64
),

new THREE.MeshPhongMaterial({
color:0x2585bd,
shininess:5
})

);

scene.add(earth);


/* صورة الأرض */

const textureLoader =
new THREE.TextureLoader();

textureLoader.load(

"https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg",

function(texture){

earth.material.map =
texture;

earth.material.color.set(
0xffffff
);

earth.material.needsUpdate =
true;

}

);


/* طبقة الحدود */

const borders =
new THREE.Group();

earth.add(borders);


/* طبقة أسماء الدول */

const labels =
new THREE.Group();

earth.add(labels);


const radius =
1.015;


function position(
lat,
lon,
r=radius
){

const phi =
THREE.MathUtils.degToRad(
lat
);

const theta =
THREE.MathUtils.degToRad(
lon
);

return new THREE.Vector3(

r *
Math.cos(phi) *
Math.sin(theta),

r *
Math.sin(phi),

r *
Math.cos(phi) *
Math.cos(theta)

);

}
<!-- الجزء 4 / 5 -->

function drawBorder(
ring
){

const points=[];


ring.forEach(
point=>{

points.push(
position(
point[1],
point[0]
)
);

});


if(points.length<2)
return;


const geometry =
new THREE.BufferGeometry()
.setFromPoints(points);


const material =
new THREE.LineBasicMaterial({

color:0x111827,

transparent:true,

opacity:0.9

});


const line =
new THREE.Line(
geometry,
material
);


borders.add(line);

}


/* إنشاء اسم الدولة */

function createLabel(
name,
lat,
lon
){

const canvas =
document.createElement(
"canvas"
);

canvas.width=512;
canvas.height=96;


const ctx =
canvas.getContext("2d");


ctx.clearRect(
0,
0,
512,
96
);


ctx.font =
"bold 30px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillStyle="#111827";


ctx.fillText(
name,
256,
48
);


const texture =
new THREE.CanvasTexture(
canvas
);


const material =
new THREE.SpriteMaterial({

map:texture,

transparent:true,

depthTest:false

});


const sprite =
new THREE.Sprite(
material
);


sprite.position =
position(
lat,
lon,
1.035
);


sprite.scale.set(
0.22,
0.041,
1
);


labels.add(sprite);

}
<!-- الجزء 5 / 5 -->

/* تحميل بيانات الدول */

fetch(

"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"

)

.then(
response =>
response.json()
)

.then(
data=>{

data.features.forEach(
country=>{

const geometry =
country.geometry;


if(!geometry)
return;


const name =
country.properties.ADMIN ||
country.properties.NAME ||
country.properties.name ||
"";


/* الحدود */

if(
geometry.type ===
"Polygon"
){

geometry.coordinates.forEach(
drawBorder
);

}


if(
geometry.type ===
"MultiPolygon"
){

geometry.coordinates.forEach(
polygon=>{

polygon.forEach(
drawBorder
);

});

}


/* حساب مكان الاسم */

if(name){

let coordinates =
geometry.coordinates;


if(
geometry.type ===
"MultiPolygon"
){

coordinates =
coordinates[0];

}


const ring =
coordinates[0];


let lat=0;
let lon=0;


ring.forEach(
point=>{

lon += point[0];
lat += point[1];

});


lat /=
ring.length;

lon /=
ring.length;


createLabel(
name,
lat,
lon
);

}

});

}

);


/* تشغيل الخريطة */

function animate(){

requestAnimationFrame(
animate
);

earth.rotation.y +=
0.0005;

controls.update();

renderer.render(
scene,
camera
);

}

animate();


/* تغيير الحجم */

window.addEventListener(
"resize",
function(){

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>

</html>
