<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>azzi_map</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    #earth {
      width: 100%;
      height: 100%;
    }

    .title {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;

      background: white;

      padding: 14px 22px;

      border-radius: 18px;

      color: #1e293b;

      font-family: Arial, sans-serif;

      font-size: 22px;

      font-weight: bold;

      box-shadow:
        0 5px 25px rgba(0,0,0,0.12);
    }

    #error {
      position: fixed;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      font-family: Arial, sans-serif;

      font-size: 18px;

      color: #334155;

      text-align: center;

      display: none;
    }
  </style>
</head>

<body>

  <div class="title">
    🌍azzi_map
  </div>

  <div id="error">
    لا يمكن تشغيل الخريطة 3D على هذا المتصفح.
  </div>

  <div id="earth"></div>
<script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

      "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>


  <script type="module">

    import * as THREE from "three";

    import { OrbitControls }
      from "three/addons/controls/OrbitControls.js";


    const container =
      document.getElementById("earth");


    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(0xffffff);


    const camera =
      new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
      );


    camera.position.z = 3;


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });


    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    container.appendChild(renderer.domElement);


    const controls =
      new OrbitControls(
        camera,
        renderer.domElement
      );


    controls.enableDamping = true;

    controls.enablePan = false;

    controls.minDistance = 1.5;

    controls.maxDistance = 5;
/*
     * الكرة الأرضية
     */

    const geometry =
      new THREE.SphereGeometry(
        1,
        64,
        64
      );


    /*
     * لون الأرض الأساسي
     * سيظهر حتى لو فشلت صورة الخريطة
     */

    const material =
      new THREE.MeshStandardMaterial({
        color: 0x2389c9,
        roughness: 0.8,
        metalness: 0
      });


    const earth =
      new THREE.Mesh(
        geometry,
        material
      );


    scene.add(earth);


    /*
     * إضاءة
     */

    const light =
      new THREE.DirectionalLight(
        0xffffff,
        3
      );


    light.position.set(
      5,
      3,
      5
    );


    scene.add(light);


    const ambient =
      new THREE.AmbientLight(
        0xffffff,
        1.5
      );


    scene.add(ambient);


    /*
     * محاولة إضافة صورة الأرض
     */

    const loader =
      new THREE.TextureLoader();


    loader.load(
      "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",

      function(texture) {

        material.map = texture;

        material.color.set(0xffffff);

        material.needsUpdate = true;

      },

      undefined,

      function() {

        console.log(
          "تم استخدام الكرة بدون صورة الأرض"
        );

      }
    );
/*
     * دوران تلقائي
     */

    function animate() {

      requestAnimationFrame(animate);


      earth.rotation.y += 0.0015;


      controls.update();


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /*
     * تغيير حجم الخريطة
     */

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    /*
     * اختبار WebGL
     */

    if (!renderer.getContext()) {

      document.getElementById(
        "error"
      ).style.display = "block";

    }

<!-- مهم جدًا داخل index.html -->

<script type="module">
  window.azziMap = {
    THREE,
    scene,
    earth
  };
</script>

<script
  type="module"
  src="assest/js/countries.js">
</script>
</body>
</html>
