<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>AZZI WORLD 3D</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#fff;
font-family:Arial,sans-serif;
}

#globe{
width:100%;
height:100%;
}

.title{
position:fixed;
top:18px;
right:18px;
z-index:10;
padding:12px 20px;
background:#fff;
color:#111827;
border-radius:16px;
font-size:20px;
font-weight:bold;
box-shadow:0 4px 20px rgba(0,0,0,.15);
}

#loading{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:20;
padding:12px 18px;
background:#fff;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<div class="title">
AZZI WORLD 🌍
</div>


<div id="globe"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

const container =
document.getElementById("globe");

const loading =
document.getElementById("loading");


const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0xffffff);


const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
100
);

camera.position.set(
0,
0,
3
);


const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setPixelRatio(
Math.min(
window.devicePixelRatio || 1,
2
));


renderer.setSize(
window.innerWidth,
window.innerHeight
);


container.appendChild(
renderer.domElement
);
const controls =
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;
controls.enablePan = false;

controls.minDistance = 1.5;
controls.maxDistance = 5;


scene.add(
new THREE.AmbientLight(
0xffffff,
1.8
)
);


const light =
new THREE.DirectionalLight(
0xffffff,
2.5
);

light.position.set(
5,
3,
5
);

scene.add(light);


/* الكرة */

const earth =
new THREE.Mesh(

new THREE.SphereGeometry(
1,
64,
64
),

new THREE.MeshPhongMaterial({
color:0xffffff,
shininess:5
})

);

scene.add(earth);


/* طبقات الخريطة */

const borders =
new THREE.Group();

const labels =
new THREE.Group();

earth.add(borders);
earth.add(labels);
/* صورة الأرض */

new THREE.TextureLoader().load(

"https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg",

function(texture){

texture.encoding =
THREE.sRGBEncoding;

earth.material.map =
texture;

earth.material.needsUpdate =
true;

},

undefined,

function(){

earth.material.color =
new THREE.Color(0x4c9ed0);

}

);


/*
تحويل خطوط GeoJSON
إلى سطح الكرة
*/

function point(
lon,
lat,
radius
){

const a =
lat*Math.PI/180;

const b =
lon*Math.PI/180;


return new THREE.Vector3(

-radius*
Math.cos(a)*
Math.cos(b),

radius*
Math.sin(a),

radius*
Math.cos(a)*
Math.sin(b)

);

}


const BORDER =
1.006;

const LABEL =
1.025;
/*
رسم حدود الدولة
*/

function drawRing(
ring
){

if(!ring || ring.length<2)
return;


const points=[];


ring.forEach(
p=>{

points.push(
point(
p[0],
p[1],
BORDER
)
);

});


points.push(
points[0]
);


const geometry =
new THREE.BufferGeometry()
.setFromPoints(points);


const material =
new THREE.LineBasicMaterial({

color:0x172033,

transparent:true,

opacity:0.9

});


borders.add(

new THREE.Line(
geometry,
material
)

);

}


/* رسم Polygon */

function drawGeometry(
geometry
){

if(
geometry.type==="Polygon"
){

geometry.coordinates.forEach(
drawRing
);

}


if(
geometry.type==="MultiPolygon"
){

geometry.coordinates.forEach(
polygon=>{

polygon.forEach(
drawRing
);

});

}

}
/*
إنشاء اسم الدولة
*/

function addLabel(
name,
lon,
lat
){

const canvas =
document.createElement("canvas");

canvas.width=512;
canvas.height=80;


const ctx =
canvas.getContext("2d");


let size=28;


if(name.length>18)
size=22;

if(name.length>25)
size=18;


ctx.font =
"bold "+size+"px Arial";

ctx.textAlign="center";
ctx.textBaseline="middle";


/* حدود بيضاء */

ctx.strokeStyle="#ffffff";
ctx.lineWidth=7;

ctx.strokeText(
name,
256,
40
);


/* الاسم */

ctx.fillStyle="#111827";

ctx.fillText(
name,
256,
40
);


const texture =
new THREE.CanvasTexture(
canvas
);


const material =
new THREE.SpriteMaterial({

map:texture,

transparent:true,

depthTest:false

});


const sprite =
new THREE.Sprite(
material
);


sprite.position =
point(
lon,
lat,
LABEL
);


sprite.scale.set(
0.28,
0.044,
1
);


labels.add(sprite);

}
/*
الحصول على اسم الدولة
*/

function nameOf(feature){

const p =
feature.properties || {};

return (
p.ADMIN ||
p.NAME ||
p.NAME_EN ||
p.name ||
p.SOVEREIGNT ||
""
);

}


/*
تمييز المغرب والصحراء
*/

function countryKey(
feature
){

const p =
feature.properties || {};

const name =
String(
nameOf(feature)
).toLowerCase();


const iso =
String(
p.ISO_A3 ||
p.ADM0_A3 ||
p.ISO3 ||
""
).toUpperCase();


if(
iso==="MAR" ||
name==="morocco"
){

return "MAR";

}


if(
iso==="ESH" ||
name.includes("western sahara")
){

return "MAR";

}


return iso || name;

}
/*
تحميل بيانات الدول
*/

fetch(
"https://raw.githubusercontent.com/datasets/geo-countries/main/data/countries.geojson"
)

.then(
r=>{

if(!r.ok)
throw new Error("GeoJSON");

return r.json();

}
)

.then(
data=>{

const countries={};


/*
تجميع الدول
*/

data.features.forEach(
feature=>{

if(!feature.geometry)
return;


const key =
countryKey(feature);


if(!countries[key]){

countries[key]={
features:[],
name:nameOf(feature)
};

}


countries[key].features.push(
feature
);

});


/*
رسم الدول
*/

Object.keys(countries).forEach(
key=>{

const country =
countries[key];


country.features.forEach(
feature=>{

drawGeometry(
feature.geometry
);

});


/*
اسم المغرب
*/

if(key==="MAR"){

addLabel(
"Morocco",
-6,
31
);

}

});
/*
إضافة أسماء باقي الدول
*/

Object.keys(countries).forEach(
key=>{

if(key==="MAR")
return;


const country =
countries[key];


let feature =
country.features[0];


let ring=null;


if(
feature.geometry.type==="Polygon"
){

ring =
feature.geometry.coordinates[0];

}


if(
feature.geometry.type==="MultiPolygon"
){

ring =
feature.geometry.coordinates[0][0];

}


if(!ring)
return;


/*
حساب مركز تقريبي
*/

let lon=0;
let lat=0;


ring.forEach(
p=>{

lon+=p[0];
lat+=p[1];

});


lon/=ring.length;
lat/=ring.length;


/*
إضافة الاسم
*/

addLabel(
country.name,
lon,
lat
);

});


loading.style.display="none";

}

)

.catch(
error=>{

console.error(error);

loading.innerText=
"تعذر تحميل الخريطة";

}
);
/*
إظهار الأسماء الموجودة
في الجهة الأمامية فقط
*/

const cameraPoint =
new THREE.Vector3();

const labelPoint =
new THREE.Vector3();


function updateLabels(){

cameraPoint
.copy(camera.position)
.normalize();


labels.children.forEach(
sprite=>{

sprite.getWorldPosition(
labelPoint
);

labelPoint.normalize();


sprite.visible =
labelPoint.dot(
cameraPoint
)>0;

});

}


/*
التشغيل
*/

function animate(){

requestAnimationFrame(
animate
);

controls.update();

updateLabels();

renderer.render(
scene,
camera
);

}

animate();


/*
تغيير حجم الشاشة
*/

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});


</script>

</body>

</html>
