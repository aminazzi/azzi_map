<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>خريطة العالم 3D</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      font-family: Arial, sans-serif;
    }

    #globe {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
    }

    .title {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;

      background: white;
      color: #1e293b;

      padding: 14px 24px;
      border-radius: 18px;

      font-size: 22px;
      font-weight: bold;

      box-shadow:
        0 5px 25px rgba(0,0,0,.12);
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      color: #334155;
      font-size: 18px;

      z-index: 5;
    }
  </style>
</head>

<body>

  <div class="title">
    🌍 خريطة العالم 3D
  </div>

  <div class="loading" id="loading">
    جارٍ تحميل الخريطة...
  </div>

  <div id="globe"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl/dist/globe.gl.min.js"></script>

  <script>

    const loading =
      document.getElementById("loading");

    const container =
      document.getElementById("globe");


    const globe = Globe()(container);


    globe
      .backgroundColor("#ffffff")

      .globeImageUrl(
        "https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg"
      )

      .bumpImageUrl(
        "https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png"
      )

      .showAtmosphere(true)

      .atmosphereColor("#7dd3fc")

      .atmosphereAltitude(0.12);


    globe.pointOfView({
      lat: 20,
      lng: 0,
      altitude: 2.4
    });


    globe.controls().enableZoom = true;

    globe.controls().enablePan = false;

    globe.controls().autoRotate = true;

    globe.controls().autoRotateSpeed = 0.25;


    loading.style.display = "none";
/*
     * تحميل الدول
     */

    fetch(
      "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
    )

    .then(function(response) {
      return response.json();
    })

    .then(function(data) {

      globe
        .polygonsData(data.features)

        .polygonAltitude(0.008)

        .polygonCapColor(function() {
          return "rgba(30, 130, 200, 0.18)";
        })

        .polygonSideColor(function() {
          return "rgba(30, 100, 180, 0.15)";
        })

        .polygonStrokeColor(function() {
          return "rgba(30, 80, 130, 0.8)";
        })

        .polygonLabel(function(country) {

          const name =
            country.properties.ADMIN ||
            country.properties.name ||
            "دولة";

          return `
            <div style="
              background:white;
              padding:8px 12px;
              border-radius:8px;
              color:#1e293b;
              font-size:14px;
            ">
              ${name}
            </div>
          `;

        })

        .onPolygonClick(function(country) {

          const name =
            country.properties.ADMIN ||
            country.properties.name ||
            "دولة";

          alert("الدولة: " + name);

        })

        .onPolygonHover(function(country) {

          globe.polygonCapColor(
            function(item) {

              if (item === country) {
                return "rgba(14, 165, 233, 0.65)";
              }
return "rgba(30, 130, 200, 0.18)";
            }
          );

        });

    })

    .catch(function(error) {

      console.error(error);

      loading.innerHTML =
        "تعذر تحميل بيانات الدول";

    });
     /*
     * إيقاف الدوران أثناء لمس الخريطة
     */

    globe.controls().addEventListener(
      "start",
      function() {

        globe.controls()
          .autoRotate = false;

      }
    );


    /*
     * إعادة الدوران بعد 3 ثوانٍ
     */

    globe.controls().addEventListener(
      "end",
      function() {

        setTimeout(function() {

          globe.controls()
            .autoRotate = true;

        }, 3000);

      }
    );


    /*
     * دعم تغيير حجم الشاشة
     */

    window.addEventListener(
      "resize",
      function() {

        globe
          .width(window.innerWidth)
          .height(window.innerHeight);

      }
    );


    /*
     * الحجم الأول
     */

    globe
      .width(window.innerWidth)
      .height(window.innerHeight);

  </script>

</body>
</html>
