<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>خريطة العالم 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      font-family: Arial, sans-serif;
    }

    #globe {
      width: 100%;
      height: 100vh;
    }

    .title {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;

      padding: 12px 22px;
      border-radius: 15px;

      color: #1e293b;
      background: rgba(255, 255, 255, 0.9);

      font-size: 21px;
      font-weight: bold;

      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>

<body>

  <div class="title">🌍 خريطة العالم 3D</div>

  <div id="globe"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script src="https://unpkg.com/globe.gl"></script>

  <script>

    const container =
      document.getElementById("globe");

    const world =
      Globe()(container)

        .width(window.innerWidth)

        .height(window.innerHeight)

        .backgroundColor("#ffffff")

        .globeImageUrl(
          "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
        )

        .bumpImageUrl(
          "https://unpkg.com/three-globe/example/img/earth-topology.png"
        )

        .showAtmosphere(true)

        .atmosphereColor("#8ed6ff")

        .atmosphereAltitude(0.12);


    world.pointOfView({
      lat: 20,
      lng: 0,
      altitude: 2.5
    });


    world.controls().autoRotate = true;

    world.controls().autoRotateSpeed = 0.25;

    world.controls().enableZoom = true;

    world.controls().enablePan = false;
fetch(
      "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
    )

      .then(response => response.json())

      .then(data => {

        world

          .polygonsData(
            data.features
          )

          .polygonCapColor(() => {
            return "rgba(255,255,255,0.05)";
          })

          .polygonSideColor(() => {
            return "rgba(30,100,180,0.15)";
          })

          .polygonStrokeColor(() => {
            return "rgba(30,80,130,0.8)";
          })

          .polygonAltitude(0.006)


          .onPolygonHover(country => {

            world.polygonCapColor(
              feature => {

                if (feature === country) {
                  return "rgba(0,160,230,0.55)";
                }

                return "rgba(255,255,255,0.05)";
              }
            );

          })


          .onPolygonClick(country => {

            const name =
              country.properties.ADMIN ||
              country.properties.name ||
              "دولة";

            alert(
              "الدولة: " + name
            );

          });

      })

      .catch(error => {

        console.error(
          "خطأ في تحميل الدول:",
          error
        );

      });
      world.controls()
      .addEventListener(
        "start",
        () => {

          world.controls()
            .autoRotate = false;

        }
      );


    world.controls()
      .addEventListener(
        "end",
        () => {

          setTimeout(() => {

            world.controls()
              .autoRotate = true;

          }, 3000);

        }
      );


    window.addEventListener(
      "resize",
      () => {

        world
          .width(window.innerWidth)

          .height(window.innerHeight);

      }
    );

  </script>

</body>
</html>
