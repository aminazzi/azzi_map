<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>AZZI WORLD 3D</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
font-family:Arial,sans-serif;
}

#globe{
position:fixed;
inset:0;
width:100%;
height:100%;
}

.title{
position:fixed;
top:18px;
right:18px;
z-index:1000;

padding:12px 20px;

background:#ffffff;
color:#111827;

border-radius:15px;

font-size:20px;
font-weight:bold;

box-shadow:0 4px 20px rgba(0,0,0,.15);
}

.loading{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:1000;

padding:12px 18px;
background:#ffffff;
color:#111827;

border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,.15);

font-size:16px;
}

</style>

</head>

<body>

<div class="title">
🌍 AZZI WORLD
</div>

<div class="loading" id="loading">
جارٍ تحميل خريطة العالم...
</div>

<div id="globe"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

const container =
document.getElementById("globe");

const loading =
document.getElementById("loading");


/* المشهد */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0xffffff);


/* الكاميرا */

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth /
window.innerHeight,
0.1,
1000
);

camera.position.set(
0,
0,
3.2
);


/* الرندر */

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(
Math.min(
window.devicePixelRatio || 1,
2
));

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.outputEncoding =
THREE.sRGBEncoding;

container.appendChild(
renderer.domElement
);


/* التحكم */

const controls =
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;
controls.enablePan = false;

controls.minDistance = 1.6;
controls.maxDistance = 5;
/* الإضاءة */

scene.add(
new THREE.AmbientLight(
0xffffff,
1.8
)
);

const sun =
new THREE.DirectionalLight(
0xffffff,
2.5
);

sun.position.set(
5,
3,
5
);

scene.add(sun);


/* الكرة الأرضية */

const earth =
new THREE.Mesh(

new THREE.SphereGeometry(
1,
96,
96
),

new THREE.MeshPhongMaterial({

color:0xffffff,

shininess:8

})

);

scene.add(earth);


/* صورة الأرض */

const textureLoader =
new THREE.TextureLoader();

textureLoader.load(

"https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg",

function(texture){

texture.encoding =
THREE.sRGBEncoding;

earth.material.map =
texture;

earth.material.color.set(
0xffffff
);

earth.material.needsUpdate =
true;

},

undefined,

function(){

earth.material.color.set(
0x4f9ec7
);

}
);


/* مجموعة الحدود */

const borders =
new THREE.Group();

earth.add(borders);


/* مجموعة أسماء الدول */

const labels =
new THREE.Group();

earth.add(labels);


/* مستويات الارتفاع */

const BORDER_RADIUS = 1.012;

const LABEL_RADIUS = 1.035;
/*
تحويل الإحداثيات الجغرافية
إلى إحداثيات على الكرة
*/

function geoToVector(
lat,
lon,
radius
){

const phi =
THREE.MathUtils.degToRad(
lat
);

const lambda =
THREE.MathUtils.degToRad(
lon
);

return new THREE.Vector3(

radius *
Math.cos(phi) *
Math.cos(lambda),

radius *
Math.sin(phi),

radius *
Math.cos(phi) *
Math.sin(lambda)

);

}


/*
الحصول على اسم الدولة
*/

function getCountryName(
feature
){

const p =
feature.properties || {};

return (
p.ADMIN ||
p.NAME ||
p.NAME_EN ||
p.name ||
p.SOVEREIGNT ||
""
);

}


/*
المغرب + الصحراء الغربية
ضمن نفس الدولة بصرياً
*/

function getCountryKey(
feature
){

const p =
feature.properties || {};

const name =
String(
getCountryName(feature)
).toLowerCase();

const iso =
String(
p.ISO_A3 ||
p.ADM0_A3 ||
p.ISO3 ||
""
).toUpperCase();


if(
iso === "MAR" ||
name === "morocco"
){

return "MAR";

}


if(
iso === "ESH" ||
name.includes("western sahara") ||
name.includes("الصحراء")
){

return "MAR";

}


return (
iso ||
name ||
Math.random().toString()
);

}


/*
تحديد المغرب
*/

function isMorocco(
feature
){

return (
getCountryKey(feature)
=== "MAR"
);

}
/*
حساب مركز الحلقة الجغرافية
حتى يوضع الاسم فوق الدولة
*/

function ringInfo(
ring
){

if(
!ring ||
ring.length < 3
){

return null;

}


let area = 0;

let cx = 0;

let cy = 0;


for(
let i=0;
i<ring.length;
i++
){

const p1 =
ring[i];

const p2 =
ring[
(i+1) %
ring.length
];


const x1 =
p1[0];

const y1 =
p1[1];

const x2 =
p2[0];

const y2 =
p2[1];


const cross =
x1*y2 -
x2*y1;


area += cross;

cx +=
(x1+x2) *
cross;

cy +=
(y1+y2) *
cross;

}


area *= 0.5;


if(
Math.abs(area) < 0.000001
){

let lon = 0;

let lat = 0;


ring.forEach(
p=>{

lon += p[0];

lat += p[1];

}
);


return {

area:Math.abs(area),

lon:
lon/ring.length,

lat:
lat/ring.length

};

}


cx /=
6 * area;

cy /=
6 * area;


return {

area:Math.abs(area),

lon:cx,

lat:cy

};

}


/*
اختيار أكبر جزء من الدولة
*/

function findLabelPoint(
geometry
){

if(
geometry.type ===
"Polygon"
){

return ringInfo(
geometry.coordinates[0]
);

}


if(
geometry.type ===
"MultiPolygon"
){

let best = null;


geometry.coordinates.forEach(
polygon=>{

const info =
ringInfo(
polygon[0]
);


if(
info &&
(
!best ||
info.area > best.area
)
){

best = info;

}

});


return best;

}


return null;

}
/*
إنشاء اسم الدولة
*/

function createCountryLabel(
name,
lat,
lon,
isSmall
){

const canvas =
document.createElement(
"canvas"
);

canvas.width = 512;

canvas.height = 96;


const ctx =
canvas.getContext("2d");


ctx.clearRect(
0,
0,
512,
96
);


let fontSize =
isSmall ? 22 : 28;


if(
name.length > 18
){

fontSize = 21;

}


if(
name.length > 25
){

fontSize = 18;

}


ctx.font =
"bold " +
fontSize +
"px Arial";


ctx.textAlign =
"center";

ctx.textBaseline =
"middle";


ctx.fillStyle =
"#111827";

ctx.strokeStyle =
"rgba(255,255,255,0.95)";

ctx.lineWidth = 7;


ctx.strokeText(
name,
256,
48
);

ctx.fillText(
name,
256,
48
);


const texture =
new THREE.CanvasTexture(
canvas
);

texture.encoding =
THREE.sRGBEncoding;


const material =
new THREE.SpriteMaterial({

map:texture,

transparent:true,

depthTest:true,

depthWrite:false

});


const sprite =
new THREE.Sprite(
material
);


sprite.position =
geoToVector(
lat,
lon,
LABEL_RADIUS
);


let scaleX =
isSmall ? 0.16 : 0.22;

let scaleY =
isSmall ? 0.030 : 0.040;


if(
name.length > 18
){

scaleX = 0.19;

}


sprite.scale.set(
scaleX,
scaleY,
1
);


labels.add(sprite);


return sprite;

}
/*
إنشاء مفتاح للحواف
*/

function edgeKey(
a,
b
){

function pointKey(p){

return (
p[0].toFixed(6) +
"," +
p[1].toFixed(6)
);

}


const A =
pointKey(a);

const B =
pointKey(b);


return A < B
? A + "|" + B
: B + "|" + A;

}


/*
إضافة حدود الدولة
*/

function addCountryBorders(
segments
){

if(
!segments.length
){

return;

}


const positions = [];


segments.forEach(
segment=>{

positions.push(

segment[0].x,
segment[0].y,
segment[0].z,

segment[1].x,
segment[1].y,
segment[1].z

);

});


const geometry =
new THREE.BufferGeometry();


geometry.setAttribute(
"position",

new THREE.Float32BufferAttribute(
positions,
3
)

);


const material =
new THREE.LineBasicMaterial({

color:0x172033,

transparent:true,

opacity:0.95

});


const lines =
new THREE.LineSegments(
geometry,
material
);


borders.add(lines);

}


/*
تحميل بيانات جميع الدول
*/

fetch(
"https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
)

.then(
response=>{

if(!response.ok){

throw new Error(
"GeoJSON error"
);

}

return response.json();

}
)

.then(
data=>{

const groups = {};


data.features.forEach(
feature=>{

if(
!feature.geometry
){

return;

}


const key =
getCountryKey(feature);


if(!groups[key]){

groups[key] = {

name:
isMorocco(feature)
? "Morocco"
: getCountryName(feature),

features:[]

};

}


groups[key].features.push(
feature
);

});
/*
رسم حدود كل دولة
*/

Object.keys(groups).forEach(
key=>{

const group =
groups[key];

const edgeMap = {};


group.features.forEach(
feature=>{

const geometry =
feature.geometry;


function processRing(
ring
){

for(
let i=0;
i<ring.length-1;
i++
){

const a =
ring[i];

const b =
ring[i+1];


const k =
edgeKey(a,b);


if(!edgeMap[k]){

edgeMap[k] = {

a:a,

b:b,

count:0

};

}


edgeMap[k].count++;

}

}


/* Polygon */

if(
geometry.type === "Polygon"
){

geometry.coordinates.forEach(
processRing
);

}


/* MultiPolygon */

if(
geometry.type === "MultiPolygon"
){

geometry.coordinates.forEach(
polygon=>{

polygon.forEach(
processRing
);

});

}

});
const segments = [];


/*
الحدود التي تظهر مرة واحدة
هي حدود الدولة الخارجية.

وبما أن المغرب والصحراء
الغربية في نفس المجموعة،
فالحد الفاصل الداخلي بينهما
لن يتم رسمه.
*/

Object.keys(edgeMap).forEach(
key=>{

const e =
edgeMap[key];


if(
e.count === 1
){

segments.push([

geoToVector(
e.a[1],
e.a[0],
BORDER_RADIUS
),

geoToVector(
e.b[1],
e.b[0],
BORDER_RADIUS
)

]);

}

});


addCountryBorders(
segments
);


/*
تحديد موضع اسم الدولة
*/

let labelPoint = null;
/*
اسم المغرب يوضع داخل
المغرب وليس في الصحراء
*/

if(
key === "MAR"
){

labelPoint = {

lat:31.7,

lon:-6.0

};

}
else{

group.features.forEach(
feature=>{

const point =
findLabelPoint(
feature.geometry
);


if(
point &&
(
!labelPoint ||
point.area >
labelPoint.area
)
){

labelPoint = point;

}

});

}


/*
إضافة اسم الدولة
*/

if(
labelPoint
){

const isSmall =
labelPoint.area < 0.12;


createCountryLabel(

group.name,

labelPoint.lat,

labelPoint.lon,

isSmall

);

}

});


loading.style.display =
"none";

}

)

.catch(
error=>{

console.error(error);

loading.innerText =
"تعذر تحميل حدود الدول";

}
);


/*
إظهار أسماء الدول الموجودة
في الجهة المواجهة للمستخدم
*/

function updateLabelVisibility(){

const cameraPosition =
camera.position.clone();

cameraPosition.normalize();


labels.children.forEach(
sprite=>{

const normal =
sprite.position.clone()
.normalize();


const dot =
normal.dot(
cameraPosition
);


sprite.visible =
dot > -0.05;

});

}


/*
تشغيل الخريطة
*/

function animate(){

requestAnimationFrame(
animate
);


/* دوران بطيء */

earth.rotation.y +=
0.00035;


controls.update();

updateLabelVisibility();


renderer.render(
scene,
camera
);

}

animate();


/*
تغيير الحجم
*/

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>

</html>
