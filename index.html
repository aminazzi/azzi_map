<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>AZZI WORLD 3D</title>

<style>

html,
body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
font-family:Arial,sans-serif;
}

#globe{
position:fixed;
inset:0;
width:100%;
height:100%;
}

.title{
position:fixed;
top:18px;
right:18px;
z-index:10000;

padding:12px 20px;

background:#ffffff;
color:#111827;

border-radius:16px;

font-size:20px;
font-weight:bold;

box-shadow:
0 4px 20px
rgba(0,0,0,.15);

pointer-events:none;
}

.loading{
position:fixed;
left:50%;
top:50%;

transform:
translate(-50%,-50%);

z-index:10000;

padding:14px 20px;

background:#ffffff;
color:#111827;

border-radius:14px;

box-shadow:
0 5px 25px
rgba(0,0,0,.18);

font-size:16px;

white-space:nowrap;
}

</style>

</head>

<body>

<div class="title">
AZZI WORLD 🌍
</div>

<div
class="loading"
id="loading">

جارٍ تحميل خريطة العالم...

</div>

<div id="globe"></div>
<!-- Three.js -->

<script src="
https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js
"></script>

<script src="
https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js
"></script>


<!-- D3 Geo لحساب مركز الدولة -->

<script src="
https://cdn.jsdelivr.net/npm/d3-geo@3/dist/d3-geo.min.js
"></script>


<script>


const container =
document.getElementById(
"globe"
);


const loading =
document.getElementById(
"loading"
);


/* المشهد */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
0xffffff
);


/* الكاميرا */

const camera =
new THREE.PerspectiveCamera(

42,

window.innerWidth /
window.innerHeight,

0.1,

1000

);

camera.position.set(
0,
0,
3.15
);


/* الرندر */

const renderer =
new THREE.WebGLRenderer({

antialias:true,

alpha:false

});


renderer.setPixelRatio(

Math.min(

window.devicePixelRatio || 1,

2

));


renderer.setSize(

window.innerWidth,

window.innerHeight

);


renderer.outputEncoding =
THREE.sRGBEncoding;


container.appendChild(
renderer.domElement
);


/* التحكم بالكرة */

const controls =
new THREE.OrbitControls(

camera,

renderer.domElement

);


controls.enableDamping =
true;

controls.dampingFactor =
0.06;

controls.enablePan =
false;

controls.minDistance =
1.55;

controls.maxDistance =
5;

controls.rotateSpeed =
0.45;

controls.zoomSpeed =
0.7;
/* الإضاءة */

const ambient =
new THREE.AmbientLight(

0xffffff,

1.7

);

scene.add(
ambient
);


const sun =
new THREE.DirectionalLight(

0xffffff,

2.4

);

sun.position.set(

5,
3,
5

);

scene.add(
sun
);


/* الكرة الأرضية */

const earthGeometry =
new THREE.SphereGeometry(

1,

96,

96

);


const earthMaterial =
new THREE.MeshPhongMaterial({

color:0xffffff,

shininess:8

});


const earth =
new THREE.Mesh(

earthGeometry,

earthMaterial

);


/*
هذه الزاوية تجعل إفريقيا
وأوروبا في الواجهة عند البداية
*/

earth.rotation.y =
-Math.PI / 2;


scene.add(
earth
);


/* تحميل صورة الأرض */

const textureLoader =
new THREE.TextureLoader();


textureLoader.load(

"https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg",

function(texture){

texture.encoding =
THREE.sRGBEncoding;

texture.anisotropy =
renderer.capabilities.getMaxAnisotropy();


earthMaterial.map =
texture;

earthMaterial.color.set(
0xffffff
);

earthMaterial.needsUpdate =
true;

},

undefined,

function(){

earthMaterial.color.set(
0x4c9ed0
);

}

);


/* مجموعة الحدود */

const borders =
new THREE.Group();

earth.add(
borders
);


/* مجموعة أسماء الدول */

const labels =
new THREE.Group();

earth.add(
labels
);


/*
مهم جداً:

الحدود قريبة جداً من سطح
الكرة حتى لا تنزاح بصرياً.
*/

const BORDER_RADIUS =
1.003;


const LABEL_RADIUS =
1.025;
/*
تحويل إحداثيات الدولة
إلى موقع مطابق لصورة الأرض
على SphereGeometry
*/

function geoToVector(

lat,

lon,

radius

){

const latRad =
THREE.MathUtils.degToRad(
lat
);

const lonRad =
THREE.MathUtils.degToRad(
lon
);


/*
هذه المعادلة هي الجزء المهم
لتطابق GeoJSON مع صورة الأرض.

x = cos(lat) * cos(lon)
y = sin(lat)
z = -cos(lat) * sin(lon)
*/

const x =
radius *
Math.cos(latRad) *
Math.cos(lonRad);


const y =
radius *
Math.sin(latRad);


const z =
-radius *
Math.cos(latRad) *
Math.sin(lonRad);


return new THREE.Vector3(

x,
y,
z

);

}


/*
الحصول على اسم الدولة
من مختلف نسخ GeoJSON
*/

function getCountryName(
feature
){

const p =
feature.properties || {};


return (

p.name ||

p.NAME ||

p.NAME_EN ||

p.ADMIN ||

p.ADMIN_NAME ||

p.SOVEREIGNT ||

""

);

}


/*
الحصول على رمز الدولة
*/

function getCountryISO(
feature
){

const p =
feature.properties || {};


return String(

p.ISO3166_1_Alpha_3 ||

p["ISO3166-1-Alpha-3"] ||

p.ISO_A3 ||

p.ADM0_A3 ||

p.ISO3 ||

""

).toUpperCase();

}


/*
ضم الصحراء الغربية
إلى مجموعة المغرب في العرض
*/

function getCountryKey(
feature
){

const name =
String(
getCountryName(feature)
).toLowerCase();


const iso =
getCountryISO(
feature
);


/* المغرب */

if(

iso === "MAR" ||

name === "morocco"

){

return "MAR";

}


/* الصحراء الغربية */

if(

iso === "ESH" ||

name.includes(
"western sahara"
) ||

name.includes(
"west sahara"
)

){

return "MAR";

}


return (

iso ||

name

);

}
/*
اختيار اسم المغرب
*/

function getDisplayName(
group
){

if(
group.key === "MAR"
){

return "Morocco";

}


if(
group.name
){

return group.name;

}


return "Unknown";

}


/*
إنشاء حدود الدولة
*/

function drawCountryGeometry(
geometry
){

if(!geometry)
return;


/*
Polygon
*/

if(
geometry.type ===
"Polygon"
){

geometry.coordinates.forEach(

ring=>{

drawRing(
ring
);

}

);

}


/*
MultiPolygon
*/

if(
geometry.type ===
"MultiPolygon"
){

geometry.coordinates.forEach(

polygon=>{

polygon.forEach(

ring=>{

drawRing(
ring
);

}

);

}

);

}

}


/*
رسم حلقة حدود واحدة
*/

function drawRing(
ring
){

if(
!ring ||
ring.length < 2
){

return;

}


const points = [];


for(
let i=0;
i<ring.length;
i++
){

const point =
ring[i];


const lon =
point[0];

const lat =
point[1];


points.push(

geoToVector(

lat,

lon,

BORDER_RADIUS

)

);

}


/*
إغلاق الحلقة
*/

if(
points.length > 2
){

points.push(
points[0].clone()
);

}


const geometry =
new THREE.BufferGeometry()
.setFromPoints(
points
);


const material =
new THREE.LineBasicMaterial({

color:0x1b263b,

transparent:true,

opacity:0.92,

depthTest:true,

depthWrite:false

});


const line =
new THREE.Line(

geometry,

material

);


borders.add(
line
);

}
/*
إنشاء اسم الدولة
*/

function createLabel(

name,

lat,

lon,

area

){

if(
!name
){

return;

}


/*
Canvas خاص بالاسم
*/

const canvas =
document.createElement(
"canvas"
);


canvas.width =
768;

canvas.height =
128;


const ctx =
canvas.getContext(
"2d"
);


ctx.clearRect(

0,
0,

768,
128

);


/*
حجم الخط حسب طول الاسم
*/

let fontSize = 34;


if(
name.length > 18
){

fontSize = 27;

}


if(
name.length > 25
){

fontSize = 22;

}


if(
area < 0.08
){

fontSize = 22;

}


if(
area < 0.03
){

fontSize = 18;

}


/*
النص
*/

ctx.font =
"bold " +
fontSize +
"px Arial";


ctx.textAlign =
"center";


ctx.textBaseline =
"middle";


/*
حد أبيض حتى يظهر الاسم
فوق صورة الأرض
*/

ctx.strokeStyle =
"rgba(255,255,255,0.95)";


ctx.lineWidth =
9;


ctx.strokeText(

name,

384,

64

);


/*
لون الاسم
*/

ctx.fillStyle =
"#111827";


ctx.fillText(

name,

384,

64

);


/*
تحويل Canvas إلى Texture
*/

const texture =
new THREE.CanvasTexture(
canvas
);


texture.encoding =
THREE.sRGBEncoding;


texture.needsUpdate =
true;


/*
Sprite
*/

const material =
new THREE.SpriteMaterial({

map:texture,

transparent:true,

depthTest:false,

depthWrite:false

});


const sprite =
new THREE.Sprite(
material
);


/*
موضع الاسم
*/

sprite.position =
geoToVector(

lat,

lon,

LABEL_RADIUS

);


/*
حجم الاسم
*/

let width =
0.30;


let height =
0.050;


if(
area < 0.10
){

width =
0.24;

height =
0.040;

}


if(
area < 0.04
){

width =
0.19;

height =
0.032;

}


sprite.scale.set(

width,

height,
1

);


/*
الأسماء فوق الحدود
*/

sprite.renderOrder =
10000;


labels.add(
sprite
);

}
/*
تحميل الدول
*/

fetch(

"https://raw.githubusercontent.com/datasets/geo-countries/main/data/countries.geojson"

)

.then(

response=>{

if(
!response.ok
){

throw new Error(
"GeoJSON failed"
);

}


return response.json();

}

)

.then(

data=>{


const countryGroups = {};


/*
تجميع الدول
*/

data.features.forEach(

feature=>{


if(
!feature.geometry
){

return;

}


const key =
getCountryKey(
feature
);


if(
!countryGroups[key]
){

countryGroups[key] = {

key:key,

name:
getCountryName(
feature
),

features:[]

};

}


countryGroups[key]
.features.push(
feature
);

});


/*
إنشاء حدود كل دولة
*/

Object.keys(
countryGroups
).forEach(

key=>{


const group =
countryGroups[key];


/*
رسم كل أجزاء الدولة
*/

group.features.forEach(

feature=>{

drawCountryGeometry(

feature.geometry

);

});


/*
حساب مركز الدولة
*/

let center = null;

let totalArea = 0;


/*
إذا كانت الدولة المغرب،
نستخدم نقطة ثابتة داخل المغرب
*/

if(
key === "MAR"
){

center = [

-6.5,

31.7

];

totalArea = 20;

}
else{


/*
إذا كانت دولة عادية،
نحسب المركز الجغرافي
*/

try{


const collection = {

type:
"FeatureCollection",

features:
group.features

};


const centroid =
d3.geoCentroid(
collection
);


/*
centroid:

[longitude, latitude]
*/

if(
centroid &&
isFinite(centroid[0]) &&
isFinite(centroid[1])
){

center =
centroid;

}


}catch(error){

console.warn(
"Centroid error:",
error
);

}


/*
احتياط في حالة فشل المركز
*/

if(!center){

const first =
group.features[0];


if(
first &&
first.geometry &&
first.geometry.coordinates
){

const coordinates =
first.geometry.coordinates;


let ring = null;


if(
first.geometry.type ===
"Polygon"
){

ring =
coordinates[0];

}


if(
first.geometry.type ===
"MultiPolygon"
){

if(
coordinates[0]
){

ring =
coordinates[0][0];

}

}


if(
ring &&
ring.length
){

let lon = 0;

let lat = 0;


ring.forEach(

p=>{

lon += p[0];

lat += p[1];

}

);


center = [

lon / ring.length,

lat / ring.length

];

}

}

}

}


/*
حساب مساحة تقريبية
من أجل حجم الاسم
*/

if(
!totalArea
){

try{

totalArea =
d3.geoArea({

type:
"FeatureCollection",

features:
group.features

});

}catch(error){

totalArea =
0.1;

}

}


/*
إضافة اسم الدولة
*/

if(
center
){

const name =
getDisplayName(
group
);


createLabel(

name,

center[1],

center[0],

totalArea

);

}

});


/*
إخفاء رسالة التحميل
*/

loading.style.display =
"none";

}

)

.catch(

error=>{

console.error(
error
);


loading.innerText =
"تعذر تحميل بيانات الدول";

}
);
/*
إظهار أسماء الدول
الموجودة أمام المستخدم فقط
*/

const worldPosition =
new THREE.Vector3();


const cameraDirection =
new THREE.Vector3();


function updateLabels(){

/*
موقع الكاميرا من مركز الكرة
*/

cameraDirection.copy(
camera.position
);

cameraDirection.normalize();


labels.children.forEach(

sprite=>{


/*
الحصول على موقع الاسم
الحقيقي بعد دوران الكرة
*/

sprite.getWorldPosition(
worldPosition
);


worldPosition.normalize();


/*
قياس هل الاسم في الجهة
المواجهة للكاميرا
*/

const visibility =
worldPosition.dot(
cameraDirection
);


/*
أظهر الاسم إذا كان أمام الكرة
*/

sprite.visible =
visibility > 0.08;

});

}


/*
تحسين ظهور الخطوط
*/

function updateBorders(){

borders.children.forEach(

line=>{

line.visible =
true;

}

);


/*
تدوير الكرة ببطء
*/

function rotateEarth(){

earth.rotation.y +=
0.00012;

}


/*
الحركة الرئيسية
*/

function animate(){

requestAnimationFrame(
animate
);


/*
دوران الكرة
*/

rotateEarth();


/*
تحريك التحكم
*/

controls.update();


/*
تحديث الأسماء
*/

updateLabels();


/*
تحديث الحدود
*/

updateBorders();


/*
الرسم
*/

renderer.render(

scene,

camera

);

}


/*
بدء التشغيل
*/

animate();
/*
تغيير حجم الخريطة
عند تغيير حجم الشاشة
*/

window.addEventListener(

"resize",

function(){

const width =
window.innerWidth;

const height =
window.innerHeight;


/*
تحديث الكاميرا
*/

camera.aspect =
width / height;


camera.updateProjectionMatrix();


/*
تحديث الرندر
*/

renderer.setSize(

width,

height

);


renderer.setPixelRatio(

Math.min(

window.devicePixelRatio || 1,

2

);

});


/*
إعادة حساب الأسماء
عند دوران المستخدم للكرة
*/

renderer.domElement.addEventListener(

"touchend",

function(){

setTimeout(

function(){

updateLabels();

},

50

);

});


renderer.domElement.addEventListener(

"mouseup",

function(){

setTimeout(

function(){

updateLabels();

},

50

);

});


/*
منع سحب الصفحة على الهاتف
*/

renderer.domElement.style.touchAction =
"none";


</script>

</body>

</html>
