<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>خريطة العالم 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      font-family: Arial, sans-serif;
    }

    #globe {
      width: 100%;
      height: 100vh;
    }

    .title {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;

      padding: 12px 20px;
      border-radius: 14px;

      color: white;
      background: rgba(15, 23, 42, 0.85);

      font-size: 21px;
      font-weight: bold;

      box-shadow: 0 5px 25px rgba(0,0,0,.3);
      backdrop-filter: blur(8px);
    }

    .hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;

      padding: 10px 15px;
      border-radius: 10px;

      color: #e2e8f0;
      background: rgba(15
<!-- مكتبة Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <!-- مكتبة Globe.gl -->
  <script src="https://unpkg.com/globe.gl"></script>

  <script>
    const globeContainer = document.getElementById("globe");

    const globe = Globe()(globeContainer)
      .backgroundColor("#020617")

      // صورة سطح الأرض
      .globeImageUrl(
        "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
      )

      // إضاءة ليلية
      .nightSkyImageUrl(
        "https://unpkg.com/three-globe/example/img/night-sky.png"
      )

      // حدود الدول
      .polygonStrokeColor(() => "#ffffff")
      .polygonSideColor(() => "rgba(0,0,0,0.15)")
      .polygonCapColor(() => "rgba(30, 100, 180, 0.12)")

      // عرض الدول
      .polygonsTransitionDuration(300);

    // حجم الكرة
    globe.pointOfView({
      lat: 20,
      lng: 0,
      altitude: 2.3
    });

    // دوران تلقائي
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.35;

    // السماح بالتحكم
    globe.controls().enableZoom = true;
    globe.controls().enablePan = false;
// تحميل حدود الدول
    fetch(
      "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
    )
      .then(response => response.json())
      .then(data => {

        globe
          .polygonsData(data.features)

          // لون الدولة
          .polygonCapColor(feature => {
            return "rgba(30, 120, 190, 0.35)";
          })

          // عند مرور الماوس
          .polygonAltitude(feature => {
            return 0.01;
          })

          // عند الضغط على الدولة
          .onPolygonClick(feature => {

            const name =
              feature.properties.ADMIN ||
              feature.properties.name ||
              "دولة";

            alert("لقد اخترت: " + name);

          })

          // عند مرور الم
// جعل الخريطة متجاوبة مع حجم الشاشة
    function resizeGlobe() {

      const width = window.innerWidth;
      const height = window.innerHeight;

      globe
        .width(width)
        .height(height);
    }

    window.addEventListener("resize", resizeGlobe);

    resizeGlobe();

    // إيقاف الدوران مؤقتًا عند التفاعل
    globe.controls().addEventListener("start", () => {
      globe.controls().autoRotate = false;
    });

    globe.controls().addEventListener("end", () => {
      setTimeout(() => {
        globe.controls().autoRotate = true;
      }, 3000);
    });

  </script>

</body>
</html>
