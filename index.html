<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>العالم 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #globe {
      width: 100%;
      height: 100vh;
    }

    .title {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;

      padding: 12px 22px;
      border-radius: 15px;

      color: white;
      background: rgba(10, 20, 40, .85);

      font-size: 21px;
      font-weight: bold;

      backdrop-filter: blur(10px);
    }
  </style>
</head>

<body>

  <div class="title">🌍 العالم 3D</div>

  <div id="globe"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script src="https://unpkg.com/globe.gl"></script>

  <script>

    const container = document.getElementById("globe");

    const world = Globe()(container)

      .width(window.innerWidth)
      .height(window.innerHeight)

      .backgroundColor("#000814")

      .globeImageUrl(
        "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
      )

      .bumpImageUrl(
        "https://unpkg.com/three-globe/example/img/earth-topology.png"
      )

      .showAtmosphere(true)

      .atmosphereColor("#4cc9f0")

      .atmosphereAltitude(0.15);


    world.pointOfView({
      lat: 20,
      lng: 0,
      altitude: 2.5
    });


    world.controls().autoRotate = true;

    world.controls().autoRotateSpeed = 0.3;

    world.controls().enableZoom = true;

    world.controls().enablePan = false;
/*
     * تحميل حدود الدول
     */

    fetch(
      "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
    )
      .then(response => response.json())

      .then(countries => {

        world
          .polygonsData(countries.features)

          .polygonCapColor(() => {
            return "rgba(40, 140, 220, 0.20)";
          })

          .polygonSideColor(() => {
            return "rgba(0, 80, 150, 0.20)";
          })

          .polygonStrokeColor(() => {
            return "rgba(255,255,255,0.7)";
          })

          .polygonAltitude(0.006)


          .onPolygonHover(country => {

            world.polygonCapColor(feature => {

              if (feature === country) {
                return "rgba(0, 220, 255, 0.65)";
              }

              return "rgba(40, 140, 220, 0.20)";
            });

          })


          .onPolygonClick(country => {

            const name =
              country.properties.ADMIN ||
              country.properties.name ||
              "دولة";

            alert("الدولة: " + name);

          });

      })

      .catch(error => {

        console.error(
          "حدث خطأ أثناء تحميل الدول:",
          error
        );

      });
/*
     * إيقاف الدوران أثناء تحريك الكرة
     */

    world.controls().addEventListener(
      "start",
      () => {
        world.controls().autoRotate = false;
      }
    );


    world.controls().addEventListener(
      "end",
      () => {

        setTimeout(() => {
          world.controls().autoRotate = true;
        }, 3000);

      }
    );


    /*
     * دعم الهاتف والكمبيوتر
     */

    window.addEventListener(
      "resize",
      () => {

        world
          .width(window.innerWidth)
          .height(window.innerHeight);

      }
    );

  </script>

</body>
</html>
